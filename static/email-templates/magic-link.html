{{ define "magic-link" }}
{{ template "header" . }}

<h1>Your sign-in link</h1>

<p>Click the button below to sign in. The link works once and expires in {{ .ExpiryMinutes }} minutes.</p>

<div style="text-align: center; margin: 28px 0;">
    <a href="{{ RootURL }}/magic-login?token={{ .Token }}" class="button"
        style="background-color: #18181b; color: #fafafa; display: inline-block; border-radius: 6px; padding: 12px 32px; text-decoration: none; font-weight: 500; font-size: 14px;">
        Sign in
    </a>
</div>

<p class="text-muted" style="color: #71717a; font-size: 14px;">
    If you didn't ask to sign in, you can safely ignore this email.
</p>

{{ template "footer" . }}
{{ end }}
