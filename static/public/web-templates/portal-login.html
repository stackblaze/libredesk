{{ define "portal-login" }}
{{ template "header" . }}
<link href="/static/public/static/request.css" rel="stylesheet" />
<div class="req">
    <h1>{{ L.T "portal.title" }}</h1>
    <p class="muted">{{ L.T "portal.loginHelp" }}</p>
    <div class="req-card">
        <form id="portal-login-form" novalidate>
            <label for="email">{{ L.T "globals.terms.email" }}</label>
            <input id="email" name="email" type="email" required />
            <button type="submit" class="btn">{{ L.T "portal.sendLink" }}</button>
            <p id="portal-login-msg" class="banner" style="display:none">{{ L.T "portal.linkSent" }}</p>
        </form>
    </div>
</div>
<script>
document.getElementById('portal-login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var email = document.getElementById('email').value;
    fetch('/api/v1/portal/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
    }).finally(function () {
        document.getElementById('portal-login-msg').style.display = 'block';
    });
});
</script>
{{ template "footer" }}
{{ end }}
