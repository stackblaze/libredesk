name: Pipeline

# Push-to-main pipeline: run the frontend + Go test suites (tests.yml), and
# only once both pass build & publish the Docker image and roll it out to
# leaseweb-montreal (ns libredesk).
#
# No pull_request trigger here (stackblaze/region-provisioner#170): the deploy
# job runs on our self-hosted runner with the Montreal kubeconfig, so this
# workflow is only reachable by a push to main or a manual dispatch. Pull
# requests run the same tests on GitHub-hosted runners via ci.yml.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: pipeline-${{ github.ref }}
  # Never cancel a main run mid-flight: it builds & deploys to prod.
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  docker:
    name: Build & Publish Docker image
    # Image build only needs GITHUB_TOKEN, so it runs GitHub-hosted.
    needs: tests
    # NOTE: the leading !cancelled() is REQUIRED. Without a status-check function,
    # GitHub skips a job whose `needs` were skipped (the test jobs are `if: false`),
    # regardless of the rest of this `if` — which is why every push since the
    # test-skip change deployed nothing. !cancelled() forces the `if` to evaluate.
    if: |
      !cancelled() &&
      github.event_name != 'pull_request' &&
      github.repository == 'stackblaze/libredesk' &&
      (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$VERSION" ]; then
            VERSION="v2.8.0-sb"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ci
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LIBREDESK_VERSION=${{ steps.version.outputs.version }}
            VITE_APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Summary
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    # Roll the freshly built image out to leaseweb-montreal (ns libredesk).
    # The pod command already runs `--upgrade --yes` before start, so schema
    # migrations (e.g. webhook delivery) apply on rollout.
    needs: docker
    # Same status-function requirement as `docker`: deploy sits downstream of the
    # skipped test jobs, so without !cancelled() GitHub skips it even when the
    # build succeeded. Guard on docker success so a failed build never deploys.
    # The only job that needs our infra (kubectl + KUBECONFIG_MONTREAL_B64), so
    # the only one left on the self-hosted runner. Never on a pull request.
    if: |
      !cancelled() && needs.docker.result == 'success' &&
      github.event_name != 'pull_request' &&
      github.repository == 'stackblaze/libredesk' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, kubero]
    steps:
      - name: Install kubectl
        run: |
          if command -v kubectl >/dev/null 2>&1; then
            kubectl version --client
            exit 0
          fi
          install -d "$RUNNER_TEMP/bin"
          curl -fsSL "https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl" \
            -o "$RUNNER_TEMP/bin/kubectl"
          chmod +x "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Deploy to leaseweb-montreal
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ needs.docker.outputs.digest }}
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_MONTREAL_B64 }}
        run: |
          set -euo pipefail
          KCFG="$RUNNER_TEMP/kubeconfig"
          trap 'rm -f "$KCFG"' EXIT
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$KCFG"
          export KUBECONFIG="$KCFG"
          ctx="$(kubectl config current-context)"
          echo "Cluster context: $ctx"
          if [ "$ctx" != "montreal" ]; then
            echo "Refusing to deploy: context is '$ctx', expected 'montreal'"
            exit 1
          fi
          echo "Rolling out image: $IMAGE_REF"
          kubectl -n libredesk set image deploy/libredesk libredesk="$IMAGE_REF"
          kubectl -n libredesk rollout status deploy/libredesk --timeout=300s
          echo "### Deployed to leaseweb-montreal ($ctx)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
