<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script>
    (function () {
      try {
        localStorage.setItem('libredesk_ui_layout', 'zendesk')
        document.documentElement.classList.add('zendesk-layout')
        document.documentElement.classList.remove('mobile-layout')
        var meta = document.querySelector('meta[name="viewport"]')
        if (meta) meta.content = 'width=device-width, initial-scale=1, viewport-fit=cover'
      } catch (e) {}
    })()
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap"
    rel="stylesheet">

  <!-- PWA: installable app metadata -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#2ca01c" />
  <meta name="application-name" content="Libredesk" />
  <link rel="icon" type="image/png" sizes="192x192" href="/images/pwa-192.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Libredesk" />
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
